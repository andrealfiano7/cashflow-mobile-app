name: Build Android APK (Tauri v2)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Android APK with Tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx @tauri-apps/cli android init --ci
          npx @tauri-apps/cli android build --apk --split-per-abi false

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Cashflow-Mobile-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
